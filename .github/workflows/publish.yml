name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-websystems/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: client-websystems
      - name: Build
        run: npm run build
        working-directory: client-websystems
        env:
          VITE_API_URL: https://dummyjson.com
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Add SPA fallback
        run: cp client-websystems/dist/index.html client-websystems/dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client-websystems/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
